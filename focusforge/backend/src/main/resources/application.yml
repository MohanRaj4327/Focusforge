server:
  port: 8080

spring:
  application:
    name: focusforge-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:focusforgedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:missing}
            client-secret: ${GOOGLE_CLIENT_SECRET:missing}
            scope: profile,email
          github:
            client-id: ${GITHUB_CLIENT_ID:missing}
            client-secret: ${GITHUB_CLIENT_SECRET:missing}
            scope: user:email
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:missing}
    password: ${GMAIL_APP_PASSWORD:missing}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:8f2a5b8c3d7e4f1a9b2c6d0e5f3a8b4c7d1e9f2a5b8c3d7e4f1a9b2c6d0e5f3a}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}

logging:
  level:
    root: INFO
    com.focusforge: DEBUG
    org.springframework.security: INFO
